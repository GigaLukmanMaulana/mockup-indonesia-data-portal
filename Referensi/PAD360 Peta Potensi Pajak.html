<style>
/* Layout: navy top bar (PAD360 / breadcrumb + DATA SIMULASI) over a 4-step tab rail; one content view re-rendered per step */
:root{

  --amber:#D48A1C;--amber-ink:#8A5408;--amber-soft:#FBEFD9;
  --red-ink:#9B2C2C;--red-soft:#FBE3E3;
  --blue-ink:#1F4F8F;--blue-soft:#E1ECFA;
  --land:#A9CFCF;--land2:#8CBDBD;--land-none:#D6DEE2;--sea:#EEF4F6;--block:#DDE4E8;--road:#FFFFFF;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1720;--surface:#14222D;--surface2:#192A36;--tint:#1C3340;--line:#29404F;--line2:#1E303C;
  --ink:#E4EDF2;--muted:#9EB2C0;--muted2:#6C8494;
  --navy:#07131C;--navy2:#163246;--navy-ink:#D2E0EA;--navy-muted:#8FA6B6;--lime:#D4EC7A;
  --teal:#3FB3B1;--teal-ink:#8ADBD9;--teal-soft:#12393A;--teal-mid:#2A7473;
  --amber:#E9A23A;--amber-ink:#F3C77E;--amber-soft:#3A2A12;
  --red-ink:#F2A3A3;--red-soft:#3F1E1E;
  --blue-ink:#A9C8F2;--blue-soft:#16283F;
  --land:#2C5B5C;--land2:#3A7071;--land-none:#26343E;--sea:#111F29;--block:#22323C;--road:#33495A;
  --d1:#173534;--d2:#245251;--d3:#2F6F6E;--d4:#3FA09E;
  --shadow:0 1px 3px rgba(0,0,0,.5);--shadow2:0 6px 18px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1720;--surface:#14222D;--surface2:#192A36;--tint:#1C3340;--line:#29404F;--line2:#1E303C;
  --ink:#E4EDF2;--muted:#9EB2C0;--muted2:#6C8494;
  --navy:#07131C;--navy2:#163246;--navy-ink:#D2E0EA;--navy-muted:#8FA6B6;--lime:#D4EC7A;
  --teal:#3FB3B1;--teal-ink:#8ADBD9;--teal-soft:#12393A;--teal-mid:#2A7473;
  --amber:#E9A23A;--amber-ink:#F3C77E;--amber-soft:#3A2A12;
  --red-ink:#F2A3A3;--red-soft:#3F1E1E;
  --blue-ink:#A9C8F2;--blue-soft:#16283F;
  --land:#2C5B5C;--land2:#3A7071;--land-none:#26343E;--sea:#111F29;--block:#22323C;--road:#33495A;
  --d1:#173534;--d2:#245251;--d3:#2F6F6E;--d4:#3FA09E;
  --shadow:0 1px 3px rgba(0,0,0,.5);--shadow2:0 6px 18px rgba(0,0,0,.4);color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
a{color:var(--teal-ink)}

.top{background:var(--navy);color:var(--navy-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
.top-in{max-width:1440px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.crumbs{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:600;min-width:0;flex:1}
.crumbs .logo{font-weight:800;color:#fff;letter-spacing:.02em;font-size:16px}
.crumbs .sep{color:var(--navy-muted)}
.crumbs button{background:none;border:0;color:var(--navy-ink);font-weight:600;cursor:pointer;padding:6px 2px;text-decoration:underline;text-underline-offset:3px}
.crumbs .cur{color:#fff}
.sim{color:var(--lime);font-size:11px;font-weight:800;letter-spacing:.08em;border:1px solid #3B5A2E;padding:4px 8px;border-radius:6px}
.rolebox{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--navy-muted)}
.rolebox select{background:var(--navy2);color:#fff;border:1px solid #2E5470;border-radius:8px;min-height:38px;padding:4px 10px}
.tabs{background:var(--surface);border-bottom:1px solid var(--line)}
.tabs-in{max-width:1440px;margin:0 auto;padding:0 24px;display:flex;gap:4px;overflow-x:auto}
.tabs a{display:flex;align-items:center;gap:10px;padding:14px 14px 12px;color:var(--muted);text-decoration:none;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a .n{width:24px;height:24px;border-radius:50%;background:var(--tint);color:var(--teal-ink);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--teal)}
.tabs a[aria-current="page"] .n{background:var(--teal);color:#fff}
.tabs .badge{background:var(--amber);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px}
main{max-width:1440px;margin:0 auto;padding:24px 24px 48px;display:flex;flex-direction:column;gap:18px}

.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.pagehead h1{font-size:26px;font-weight:800;letter-spacing:-.01em}
.pagehead p{margin:4px 0 0;color:var(--muted)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--teal-ink);margin-bottom:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h2{font-size:17px;font-weight:700}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.row{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.grow{flex:3 1 560px;min-width:0}.side{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:14px}
.note{font-size:12px;color:var(--muted)}
.sub{font-size:12px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.filters label{display:flex;flex-direction:column;gap:4px;background:var(--tint);border-radius:10px;padding:8px 12px 10px;font-size:12px;font-weight:700;color:var(--teal-ink)}
.filters select{border:0;background:transparent;font-weight:600;color:var(--ink);padding:2px 0;min-height:30px;font-size:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px}
.kpi .v{font-size:30px;font-weight:800;color:var(--teal-ink);font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .l{color:var(--ink);font-weight:500}
.kpi .s{font-size:12px;color:var(--muted)}
.seg{display:flex;gap:4px;background:var(--tint);padding:4px;border-radius:10px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13px;min-height:36px;padding:0 12px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.btn{min-height:44px;padding:0 18px;border-radius:10px;font-weight:700;cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center}
.btn.pri{background:var(--teal);color:#fff}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.soft{background:var(--tint);color:var(--teal-ink)}
.btn.warn{background:var(--surface);color:var(--red-ink);border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--teal-ink);font-weight:700;cursor:pointer;text-decoration:underline;min-height:34px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.teal{background:var(--teal-soft);color:var(--teal-ink)}
.chip.amber{background:var(--amber-soft);color:var(--amber-ink)}
.chip.red{background:var(--red-soft);color:var(--red-ink)}
.chip.grey{background:var(--tint);color:var(--muted)}
.chip.blue{background:var(--blue-soft);color:var(--blue-ink)}
.statusline{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--tint);border-radius:10px;padding:10px 12px;font-weight:600;font-size:13px}
.disclaim{font-size:12px;color:var(--muted);margin:0}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-size:12px;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line2);vertical-align:top}
.tablewrap{overflow-x:auto}

/* maps */
.map{position:relative;border-radius:14px;overflow:hidden;background:var(--sea);border:1px solid var(--line)}
.map svg{display:block;width:100%;height:auto}
.land{fill:var(--land);stroke:var(--surface);stroke-width:2}
.land.none{fill:var(--land-none)}
.land.d1{fill:var(--d1)}.land.d2{fill:var(--d2)}.land.d3{fill:var(--d3)}.land.d4{fill:var(--d4)}
.mtxt{font-family:var(--font);fill:var(--ink)}
.clu{position:absolute;transform:translate(-50%,-50%);border:0;padding:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center}
.clu .dot{border-radius:50%;background:var(--teal);border:3px solid var(--surface);color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow2)}
.clu.off .dot{background:var(--surface);color:var(--muted);border:2px dashed var(--muted2);box-shadow:none}
.clu.on .dot{outline:3px solid var(--ink);outline-offset:2px}
.mapfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);align-items:center}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.maptag{position:absolute;left:14px;top:14px;background:var(--tint);color:var(--teal-ink);font-size:12px;font-weight:700;padding:6px 10px;border-radius:8px;box-shadow:var(--shadow)}
.blk{fill:var(--block)}.rd{stroke:var(--road);fill:none}
.route{fill:none;stroke-linecap:round;stroke-linejoin:round}
.cp{position:absolute;transform:translate(-50%,-50%);width:44px;height:44px;border:0;padding:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cp i{width:26px;height:26px;border-radius:50%;border:3px solid var(--surface);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800;font-style:normal;box-shadow:var(--shadow2)}
.cp.done i{background:var(--teal)}.cp.todo i{background:var(--amber)}
.cp.on i{outline:3px solid var(--ink);outline-offset:2px}

/* lists */
.qitem{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;box-shadow:var(--shadow);width:100%}
.qitem b{color:var(--teal-ink);font-size:15px}
.qitem[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.reg{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.reg:hover{background:var(--surface2)}
.reg.off{cursor:default;background:var(--surface2)}
.reg .bar{grid-column:1/-1;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.reg .bar i{display:block;height:100%;background:var(--teal)}
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.tier{border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.tier .L{font-size:22px;font-weight:800;color:var(--teal)}
.tier h3{font-size:16px}
.tier .v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.tier p{margin:0;font-size:13px;color:var(--muted)}
.formula{background:var(--tint);color:var(--teal-ink);font-weight:700;font-size:13px;border-radius:10px;padding:10px 14px}

.cps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.cps button{width:100%;display:flex;gap:12px;align-items:center;text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:8px 10px;cursor:pointer;min-height:44px}
.cps button:hover{background:var(--surface2)}
.cps button[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.cps .k{font-weight:800;font-variant-numeric:tabular-nums;width:22px}
.cps .done{color:var(--teal-ink)}.cps .todo{color:var(--amber-ink)}
.prog{height:8px;background:var(--line2);border-radius:4px;overflow:hidden}.prog i{display:block;height:100%;background:var(--teal)}

.objphoto{border-radius:16px;background:var(--tint);aspect-ratio:4/3;max-width:100%;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.objphoto .board{background:var(--navy);color:#fff;font-weight:800;font-size:22px;padding:22px 26px;border-radius:2px;box-shadow:var(--shadow2)}
.objphoto .pole{position:absolute;width:8px;background:var(--muted2);bottom:0}
.objphoto .cap{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--muted)}
dl.kv{margin:0;display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px 12px}
dl.kv dt{color:var(--muted)}dl.kv dd{margin:0;font-weight:600}
.stepper{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.stepper div{border-radius:12px;padding:12px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:2px}
.stepper .k{font-size:12px;font-weight:800;color:var(--muted)}
.stepper .done{background:var(--teal-soft);border-color:transparent}.stepper .done .k{color:var(--teal-ink)}
.stepper .now{border:2px solid var(--amber)}.stepper .now .k{color:var(--amber-ink)}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.timeline li{display:grid;grid-template-columns:96px 12px minmax(0,1fr);gap:12px}
.timeline .b{width:12px;height:12px;border-radius:50%;margin-top:4px;background:var(--teal)}
.objrel{display:flex;flex-direction:column;gap:8px}
.objrel div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;background:var(--surface2)}

/* phone */
.phone{width:100%;max-width:380px;background:var(--navy);border-radius:36px;padding:12px;box-shadow:var(--shadow2);flex:none}
.screen{background:var(--bg);border-radius:26px;overflow:hidden;display:flex;flex-direction:column}
.screen header{background:var(--surface);padding:16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.screen .body{padding:14px;display:flex;flex-direction:column;gap:10px}
.fld{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.fld>span{font-size:12px;font-weight:700;color:var(--teal-ink)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px;min-height:42px;font-size:15px;width:100%}
.fld .old{font-size:11px;color:var(--muted)}
.dims{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checks li{display:flex;gap:10px;align-items:flex-start}
.checks i{width:20px;height:20px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:800;color:#fff;margin-top:1px}
.checks .ok i{background:var(--teal)}.checks .no i{background:var(--surface);border:2px solid var(--amber)}
.stepnum{font-size:18px;font-weight:800;color:var(--teal)}
.qcard{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.diff{display:grid;grid-template-columns:110px 1fr 1fr;gap:6px 10px;font-size:13px}
.diff .h{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.diff .new{font-weight:700;color:var(--teal-ink)}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.toggle input{width:20px;height:20px;accent-color:var(--teal)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:30;max-width:calc(100% - 32px)}
@media (max-width:760px){
  .top-in,.tabs-in{padding-left:16px;padding-right:16px}
  main{padding:18px 16px 40px}
  .pagehead h1{font-size:22px}
  .kpi .v{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ---------------- filter math ---------------- */
function share(){
  let cats=CATS.filter(c=>S.cat==='all'||c[0]===S.cat);
  if(S.tax!=='all')cats=cats.filter(c=>CAT_TAX[c[0]].includes(S.tax));
  return cats.reduce((a,c)=>a+c[2],0);
}
const stShare=()=>STATUS.find(s=>s[0]===S.status)[2];

  const kotaOpts=[['','Semua']].concat(S.prov==='jabar'?KOTA.filter(k=>k.data!=='none').map(k=>[k.id,k.name]):[]);
  return `<div class="filters" role="group" aria-label="Filter peta">

  </div>`;
}
function kpis(base){
  const sh=share();
  const poi=Math.round(base.poi*sh),ver=Math.round(base.ver*sh),pot=base.pot*sh;
  const st=S.status==='all'?'':`<span class="s">${fmt(Math.round(poi*stShare()))} berstatus "${STATUS.find(s=>s[0]===S.status)[1].toLowerCase()}"</span>`;
  return `<div class="kpi"><span class="v">${fmt(poi)}</span><span class="l">POI terpetakan</span>${st}</div>
    <div class="kpi"><span class="v" style="color:var(--amber-ink)">${fmt(ver)}</span><span class="l">Perlu verifikasi</span></div>
    <div class="kpi"><span class="v">${rp(pot)}</span><span class="l">Potensi indikatif / tahun</span><span class="s">Asumsi awal, untuk prioritas pemeriksaan</span></div>`;
}

function streetMap(route,opts){
  opts=opts||{};
  const blocks=[];const xs=[20,140,260,380,500,620],ys=[20,110,200,290];
  for(let i=0;i<xs.length-1;i++)for(let j=0;j<ys.length-1;j++)blocks.push(`<rect class="blk" x="${xs[i]+10}" y="${ys[j]+10}" width="100" height="70" rx="6"/>`);
  const d='M'+route.map(p=>p.join(',')).join(' L');
  return `<svg viewBox="0 0 640 310" role="img" aria-label="${opts.aria||'Ilustrasi jaringan jalan'}">
    <rect width="640" height="310" fill="var(--sea)"/>${blocks.join('')}
    ${xs.map(x=>`<path class="rd" d="M${x},0 L${x},310" stroke-width="12"/>`).join('')}${ys.map(y=>`<path class="rd" d="M0,${y} L640,${y}" stroke-width="12"/>`).join('')}
    ${(opts.extra||[]).map(r=>`<path class="route" d="M${r.map(p=>p.join(',')).join(' L')}" stroke="var(--teal-mid)" stroke-width="5" stroke-dasharray="8 7" opacity=".8"/>`).join('')}
    <path class="route" d="${d}" stroke="var(--teal)" stroke-width="7"/>
    ${opts.dots?route.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="10" fill="${opts.done&&!opts.done[i]?'var(--amber)':'var(--teal)'}" stroke="var(--surface)" stroke-width="3"/>`).join(''):''}
  </svg>`;
}

function checks(){
  const f=S.form,o=S.obj;
  const dimOk=f.w>0&&f.h>0;
  const changed=f.mode==='new'||(f.w!==o.w||f.h!==o.h||f.owner!==o.owner||f.izin!==o.izinUsaha);
  return [
    ['Foto baru + waktu pengambilan',f.photo],
    ['GPS terkunci, akurasi ≤ 10 m',f.gps],
    ['Dimensi terisi dan masuk akal',dimOk&&f.w<=30&&f.h<=30],
    [f.mode==='new'?'Nama / keterangan objek diisi':'Ada perubahan dibanding data lama',f.mode==='new'?f.name.trim().length>2:changed],
    ['Alasan revisi diisi',f.reason.trim().length>=5],
    ['Cek duplikasi: tidak ada objek sejenis dalam 15 m',true]
  ];
}

          <div class="fld"><span>Foto baru + waktu pengambilan</span>${f.photo?`<b style="font-size:13px">✓ Foto diambil 14 Sep 2026, 10.05</b>`:`<button type="button" class="btn sec" data-act="fPhoto">Ambil foto</button>`}</div>
          <div class="fld"><span>GPS + akurasi lokasi</span>${f.gps?`<b style="font-size:13px">✓ Terkunci · akurasi ±4 m</b>`:`<button type="button" class="btn sec" data-act="fGps">Kunci lokasi</button>`}</div>
          <div class="fld"><span>Ukuran (meter)</span><div class="dims"><input type="number" min="0" step="0.5" id="fW" data-in="f.w" value="${f.w}" aria-label="Lebar"><span>×</span><input type="number" min="0" step="0.5" id="fH" data-in="f.h" value="${f.h}" aria-label="Tinggi"></div>${f.mode==='update'?`<span class="old">Data lama: ${o.w} × ${o.h} m</span>`:''}</div>

          <label class="fld" for="fIzin"><span>Izin usaha / izin objek</span><select id="fIzin" data-ch="f.izin">${['Belum diverifikasi','Dokumen diunggah','Terverifikasi','Tidak ada izin'].map(x=>`<option ${f.izin===x?'selected':''}>${x}</option>`).join('')}</select></label>
          <label class="fld" for="fReason"><span>Alasan revisi</span><textarea id="fReason" rows="2" data-in="f.reason" placeholder="Contoh: ukuran papan berubah setelah renovasi">${f.reason}</textarea></label>
          <button type="submit" class="btn pri" ${ok?'':'disabled'}>${S.offline?'Simpan ke antrean offline':'Simpan &amp; ajukan verifikasi'}</button>

    <div style="flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:14px">
      <div class="card"><div><span class="stepnum">1. Rekam perubahan</span><p style="margin:4px 0 0">Data lama dipertahankan; petugas mengisi alasan revisi dan menambahkan bukti.</p></div></div>
      <div class="card"><span class="stepnum">2. Cek sebelum kirim</span>

      </div>
      ${S.sync.length?`<div class="card" style="border-color:var(--amber)"><div class="cardhead"><h2>Antrean sinkronisasi</h2><span class="chip amber">${S.sync.length} draf</span></div>${S.sync.map(q=>`<div class="sub">${q.id} · ${q.title}</div>`).join('')}<button class="btn soft" data-act="sync" ${S.offline?'disabled':''}>${S.offline?'Menunggu jaringan…':'Sinkronkan sekarang'}</button></div>`:''}

        ${!canDecide&&S.queue.some(q=>q.st==='wait')?`<div class="statusline"><span>Keputusan hanya oleh verifier/supervisor.</span><button class="linkbtn" data-act="beVerifier">Ganti peran ke Verifier</button></div>`:''}
        ${S.queue.length?S.queue.map(q=>`<div class="qcard"><div class="cardhead"><b>${q.id} · ${q.title}</b><span class="chip ${q.st==='wait'?'amber':q.st==='ok'?'teal':'red'}">${q.st==='wait'?'Menunggu verifier':q.st==='ok'?'Disetujui':'Dikembalikan ke petugas'}</span></div>
          <div class="diff"><span class="h">ISIAN</span><span class="h">DATA LAMA</span><span class="h">DIAJUKAN</span>${q.diff.map(d=>`<span class="sub">${d[0]}</span><span>${d[1]}</span><span class="${d[1]!==d[2]?'new':''}">${d[2]}</span>`).join('')}</div>
          <span class="sub">Alasan: ${q.reason} · Bukti: foto, GPS ±4 m</span>
          ${q.st==='wait'?`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" data-act="approve" data-k="${q.id}" ${canDecide?'':'disabled'}>Terima</button><button class="btn warn" data-act="reject" data-k="${q.id}" ${canDecide?'':'disabled'}>Kembalikan</button></div>`:q.st==='ok'?`<button class="linkbtn" data-corr="${q.corr||''}" data-act="${q.kind==='new'?'backTask':'goDetail'}" style="text-align:left">${q.kind==='new'?'Lihat checkpoint di tugas →':'Lihat detail objek yang diperbarui →'}</button>`:''}
        </div>`).join(''):`<span class="sub">Belum ada pengajuan. Isi formulir lalu tekan Simpan &amp; ajukan verifikasi.</span>`}

/* ---------------- router & chrome ---------------- */
const PAGES=[['peta','Peta & Potensi'],['detail','Detail Objek'],['sisir','Sisir Jalan'],['update','Update Data']];
const VIEWS={peta:vPeta,detail:vDetail,sisir:vSisir,update:vUpdate};
function crumbs(){
  const parts=[`<span class="logo">PAD360</span>`];
  const add=(h,act)=>parts.push(`<span class="sep">/</span>`+(act?`<button data-act="${act}">${h}</button>`:`<span class="cur">${h}</span>`));
  if(S.page==='peta'){
    if(S.level==='nasional')add('Peta &amp; Potensi');
    else{add('Peta &amp; Potensi','toNas');const p=PROV.find(x=>x.id===S.prov);
      if(S.level==='provinsi')add(p.name);else{add(p.name,'toProv');add(KOTA.find(k=>k.id===S.kota).name);}}
  }else if(S.page==='detail'){add('Detail');add(S.obj.id);}
  else if(S.page==='sisir'){add('Sisir Jalan');add('Tugas '+(curTask()?curTask().id:'baru'));}
  else add('Aplikasi Lapangan');
  document.getElementById('crumbs').innerHTML=parts.join('');
}
function tabs(){
  const wait=S.queue.filter(q=>q.st==='wait').length;
  document.getElementById('tabs').innerHTML=PAGES.map((p,i)=>`<a href="#${p[0]}" ${S.page===p[0]?'aria-current="page"':''}><span class="n">${i+1}</span>${p[1]}${p[0]==='update'&&wait?`<span class="badge">${wait}</span>`:''}</a>`).join('');
}
const view=document.getElementById('view');
function render(keep){
  let fid=null,pos=null;if(keep){const a=document.activeElement;if(a&&a.id){fid=a.id;try{pos=a.selectionStart}catch(e){}}}
  view.innerHTML=VIEWS[S.page]();crumbs();tabs();
  if(fid){const el=document.getElementById(fid);if(el){el.focus();try{if(pos!=null)el.setSelectionRange(pos,pos)}catch(e){}}}
}
function go(p){S.page=VIEWS[p]?p:'peta';render();window.scrollTo(0,0);}
function nav(p){if(location.hash==='#'+p)go(p);else location.hash=p;}
window.addEventListener('hashchange',()=>go((location.hash||'').slice(1)));

function newTask(k){
  const id='SRV-0'+(17+Object.keys(S.tasks).length);
  S.tasks[k]={id,corr:k,cps:[0,1,2,3,4].map(i=>({n:String(i+1).padStart(2,'0'),label:i===0?'Mulai / bukti kunjungan':'Belum diperiksa',done:false,find:[],note:''}))};
  return id;
}
function startForm(mode){
  const o=S.obj;
  S.form=mode==='new'?{mode:'new',photo:false,gps:false,w:0,h:0,owner:'',izin:'Belum diverifikasi',reason:'',cat:'rek',name:'',cp:curTask().cps[S.cpSel].n,corr:S.corr,cpi:S.cpSel}
    :{mode:'update',photo:false,gps:false,w:o.w,h:o.h,owner:o.owner,izin:o.izinUsaha,reason:'',cat:'rek',name:'',cp:null};
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,k=t.dataset.k;
  switch(a){
    case 'prov':S.prov=k;S.level='provinsi';S.kota=null;render();window.scrollTo(0,0);break;
    case 'kota':S.kota=k;S.level='kota';render();window.scrollTo(0,0);break;
    case 'toNas':S.level='nasional';S.prov=null;S.kota=null;if(S.page!=='peta')nav('peta');else render();break;
    case 'toProv':S.level='provinsi';S.kota=null;render();break;
    case 'noData':toast(k+': data belum tersedia. Rincian muncul setelah data daerah diimpor.');break;
    case 'layer':S.layer=k;render();break;
    case 'corr':S.corr=k;render();break;
    case 'makeTask':{if(!S.tasks[S.corr]){const id=newTask(S.corr);toast('Tugas '+id+' dibuat untuk '+CORR[S.corr].name);}S.cpSel=0;nav('sisir');break;}
    case 'taskSel':S.corr=k;S.cpSel=0;render();break;
    case 'cp':S.cpSel=+k;render();break;
    case 'cpPhoto':{const c=curTask().cps[S.cpSel];c.done=true;c.label=c.n==='01'?'Mulai / bukti kunjungan':'Tidak ada objek';c.note='Foto ruas diambil; tidak ditemukan objek.';toast('Checkpoint '+c.n+' ditandai diperiksa');const nx=curTask().cps.findIndex(x=>!x.done);if(nx>=0)S.cpSel=nx;render();break;}
    case 'addObj':startForm('new');nav('update');break;
    case 'goDetail':nav('detail');break;
    case 'backMap':S.level='kota';S.prov='jabar';S.kota='bdg';S.corr='A';nav('peta');break;
    case 'backTask':S.corr=t.dataset.corr||S.form.corr||S.corr;nav('sisir');break;
    case 'toUpdate':startForm('update');nav('update');break;
    case 'request':S.obj.requested=true;S.obj.stage=Math.max(S.obj.stage,3);S.obj.hist.unshift(['06 Okt 2026','Pemeriksaan objek diajukan ke verifier','Admin daerah / analis']);toast('Pemeriksaan '+S.obj.id+' diajukan');render();break;
    case 'fPhoto':S.form.photo=true;render();break;
    case 'fGps':S.form.gps=true;render();break;
    case 'beVerifier':S.role='verifier';document.getElementById('role').value='verifier';toast('Peran diganti ke Verifier / supervisor');render();break;
    case 'sync':S.sync.forEach(q=>S.queue.unshift(q));toast(S.sync.length+' draf tersinkron dan masuk antrean verifier');S.sync=[];render();break;
    case 'approve':{const q=S.queue.find(x=>x.id===k);q.st='ok';
      if(q.kind==='update'){Object.assign(S.obj,q.apply);S.obj.stage=Math.max(S.obj.stage,4);S.obj.hist.unshift(['06 Okt 2026','Perubahan '+q.id+' disetujui: '+q.summary,'Verifier · masuk basis data aktif']);startForm('update');}
      else{const task=S.tasks[q.corr];const c=task.cps[q.cpi];c.done=true;c.label=q.catLabel;c.find.push({id:q.objId,t:q.title,s:'Kandidat tervalidasi'});c.note='Objek baru disetujui verifier.';PROV[0].poi++;KOTA[0].poi++;}
      toast(q.id+' disetujui · peta diperbarui');render();break;}
    case 'reject':{const q=S.queue.find(x=>x.id===k);q.st='no';toast(q.id+' dikembalikan ke petugas untuk dilengkapi');render();break;}
    case 'toast':toast(t.dataset.msg);break;
  }
});
function setPath(path,val){const [o,key]=path.split('.');if(o==='f')S.form[key]=val;}
document.addEventListener('change',e=>{
  const c=e.target.dataset.ch;if(!c)return;const v=e.target.value;
  if(c==='prov'){if(v){S.prov=v;S.level='provinsi';}else{S.prov=null;S.level='nasional';}S.kota=null;render();}
  else if(c==='kota'){if(v){S.kota=v;S.level='kota';}else{S.kota=null;S.level='provinsi';}render();}
  else if(c==='offline'){S.offline=e.target.checked;toast(S.offline?'Jaringan terputus: pengajuan disimpan sebagai draf lokal':'Jaringan tersambung kembali');render();}
  else if(c.startsWith('f.')){setPath(c,v);render(true);}
  else{S[c]=v;render(true);}
});
document.addEventListener('input',e=>{
  const p=e.target.dataset.in;if(!p)return;let v=e.target.value;if(p==='f.w'||p==='f.h')v=parseFloat(v)||0;setPath(p,v);render(true);
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='upForm')return;e.preventDefault();
  if(!checks().every(c=>c[1]))return;
  const f=S.form,o=S.obj,id='UPD-'+String(S.seq++).padStart(3,'0');
  let q;
  if(f.mode==='update'){
    q={id,kind:'update',title:'Update '+o.id,st:'wait',reason:f.reason,
      diff:[['Ukuran',o.w+' × '+o.h+' m',f.w+' × '+f.h+' m'],['Pemilik',o.owner,f.owner],['Izin usaha',o.izinUsaha,f.izin]],
      apply:{w:f.w,h:f.h,owner:f.owner,izinUsaha:f.izin},summary:'ukuran '+f.w+' × '+f.h+' m'};
  }else{
    const cat=CATS.find(c=>c[0]===f.cat);
    q={id,kind:'new',title:'Objek baru · '+f.name,st:'wait',reason:f.reason,corr:f.corr,cpi:f.cpi,objId:'KND-'+f.cat.toUpperCase()+'-0'+(10+S.seq),catLabel:cat[1].split(' /')[0],
      diff:[['Kategori','—',cat[1]],['Ukuran','—',f.w+' × '+f.h+' m'],['Izin','—',f.izin]]};
  }
  if(S.offline){S.sync.push(q);toast(id+' disimpan ke antrean offline');}
  else{S.queue.unshift(q);toast(id+' diajukan ke verifier');}
  startForm(f.mode==='new'?'update':'update');
  render();
});
document.getElementById('role').addEventListener('change',e=>{S.role=e.target.value;toast('Peran: '+e.target.selectedOptions[0].textContent);render();});

go((location.hash||'').slice(1)||'peta');
})();
</script>
